<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mercado Pago ZDA Sandbox</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111827;background:#f3f4f6}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(720px,100%);background:white;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;font-size:26px}.muted{color:#6b7280}.box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:20px 0}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.row{display:flex;gap:12px;flex-wrap:wrap}
    button{border:0;border-radius:10px;background:#009ee3;color:white;padding:12px 18px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}.status{margin-top:18px;padding:14px;border-radius:10px;background:#eef2ff;white-space:pre-wrap}
    .ok{background:#ecfdf5;color:#065f46}.err{background:#fef2f2;color:#991b1b}
  </style>
</head>
<body>
  <main class="card">
    <h1>Mercado Pago — Zero Dollar Auth</h1>
    <p class="muted">Teste técnico em sandbox. Não aceita cartão real nem dados personalizados.</p>

    <div class="box">
      <strong>Cartão oficial de teste</strong>
      <p><code>407409••••••0004</code> · validade 02/2031 · CVV 123 · titular APRO</p>
      <p class="muted">A requisição de validação usa <code>transaction_amount: 0</code> e o header <code>X-Card-Validation: card_validation</code>.</p>
    </div>

    <div class="row">
      <button id="run">Executar teste oficial</button>
    </div>

    <div id="out" class="status" hidden></div>
  </main>
<script>
const btn = document.getElementById('run');
const out = document.getElementById('out');
btn.addEventListener('click', async () => {
  btn.disabled = true;
  out.hidden = false;
  out.className = 'status';
  out.textContent = 'Executando teste...';
  try {
    const r = await fetch('/api/test', {method:'POST', headers:{'content-type':'application/json'}});
    const data = await r.json();
    if (!r.ok) throw new Error(data.message || data.error || 'Falha no teste');
    out.className = 'status ' + (data.status === 'approved' ? 'ok' : 'err');
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    out.className = 'status err';
    out.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
